<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Authorizing</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #1a1a2e; }
  .done { color: #16a34a; font-weight: 600; }
  .fail { color: #dc2626; font-weight: 600; }
</style></head><body>
<h2>Authorizing account</h2>
<p id="status">Connecting...</p>
<script>
const challenge = "__CHALLENGE__";
const initialPhase = "__INITIAL_PHASE__";
const initialError = "__INITIAL_ERROR__";
const status = document.getElementById("status");

function notifyOpener(type, payload) {
  if (!window.opener || window.opener.closed) return;
  window.opener.postMessage({ type, challenge, ...payload }, "*");
}

function closeSoon() {
  window.setTimeout(function() { window.close(); }, 400);
}

if (initialPhase === "failed") {
  status.textContent = "Authorization failed" + (initialError ? ": " + initialError : "");
  status.className = "fail";
  notifyOpener("handles-auth-progress", {
    phase: "failed",
    error: initialError || "unknown error"
  });
} else {
  status.textContent = "Authorization confirmed. You can close this window.";
  status.className = "done";
  notifyOpener("handles-auth-progress", { phase: "oauth_complete" });
}
closeSoon();
</script></body></html>
